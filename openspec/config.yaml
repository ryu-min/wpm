schema: spec-driven

context: |
  Все артефакты OpenSpec пиши на русском языке: proposal, design, specs, tasks
  и любые другие артефакты используемой схемы. Это относится к объяснениям,
  обычным заголовкам, таблицам, задачам и результатам проверок. Сохраняй только
  необходимый служебный синтаксис и обязательные заголовки схемы, а также
  идентификаторы, пути и команды.

  wpm — терминальное приложение на Rust 2024 с Ratatui и Crossterm.
  В нём есть упражнения печати на время и перевода с русского на английский,
  выбор режима, настройки и экран результатов со скоростью и точностью.
  Состояние приложения и переходы между экранами находятся в src/app/;
  виджеты экранов — в src/ui/, настройки и модели упражнений — в src/domain/.
  src/storage/ хранит настройки в JSON, а наборы слов и переводов — в SQLite.
  Встроенные данные упражнений
  находятся в resources/. Интеграционные тесты в tests/ управляют терминалом
  через псевдотерминал. После изменений реализации проверяй поведение командой
  cargo test.

rules:
  specs:
    - "Сохраняй служебные маркеры OpenSpec (включая MODIFIED Requirements, Requirement, Scenario, WHEN, THEN) и нормативные ключевые слова SHALL/MUST. В MODIFIED Requirements сохраняй имена существующих требований и сценариев для сопоставления с основной спецификацией; не переводи идентификаторы, пути и команды."
