schema: spec-driven

context: |
  wpm is a Rust 2024 terminal application built with Ratatui and Crossterm.
  It offers timed typing and Russian-to-English translation exercises, a mode
  selector, settings, and a result screen with speed and accuracy statistics.
  Application state and screen transitions live in src/app.rs; screen widgets
  live in src/*_widget.rs. src/configuration.rs stores settings as JSON and
  word and translation sets in SQLite. Bundled exercise data lives in resources/.
  Integration tests in tests/ drive the terminal through a pseudo-terminal.
  Run cargo test to verify behavior after implementation changes.
